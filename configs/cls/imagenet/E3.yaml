data_provider:
  rrc_config:
    test_crop_ratio: 0.95
  n_worker: 12
  base_batch_size: 50
  data_aug:
  - name: randaug
    n: 2
    m: 5
  - name: erase
    p: 0.2

net_config:
  name: E3
  dropout: 0
  bb_convattention: True
  bb_convin2: True
  grouping: 1
  fastit: True
  huge_model: True
  bigit: True
  mlpremoved: True

run_config:
  n_epochs: 300
  base_lr: 0.0000625
  bsizemult: 8
  mixup_config:
    op:
    - - mixup
      - 0.3
      - 1.0
    - - cutmix
      - 0.3
      - 1.0
  mesa:
    thresh: 0.25
    ratio: 2.0

backbone_drop:
  name: droppath
  drop_prob: 0.1
  linear_decay: true
  skip: 2
